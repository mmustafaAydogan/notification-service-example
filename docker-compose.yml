services:

  php:
    build:
      context: .
      dockerfile: images/php/Dockerfile
    image: notification_php:latest
    container_name: notification_php
    restart: "on-failure:5"
    volumes:
      - ./src:/var/www/html
    networks:
      - notification_network
    depends_on:
      - mariadb
      - redis
      - rabbitmq

  worker:
    image: notification_php:latest
    container_name: notification_worker
    restart: "on-failure:5"
    command: php artisan queue:work rabbitmq --queue=notifications --timeout=30 --sleep=1
    volumes:
      - ./src:/var/www/html
    networks:
      - notification_network
    depends_on:
      - php
      - mariadb
      - redis
      - rabbitmq

  nginx:
    image: nginx:alpine
    container_name: notification_nginx
    restart: "on-failure:5"
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./images/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - notification_network
    depends_on:
      - php

  mariadb:
    image: mariadb:lts
    container_name: notification_mariadb
    restart: "on-failure:5"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - notification_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: notification_redis
    restart: "on-failure:5"
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - notification_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: notification_rabbitmq
    restart: "on-failure:5"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: notification_user
      RABBITMQ_DEFAULT_PASS: notification_pass
      RABBITMQ_DEFAULT_VHOST: notification_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - notification_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: notification_mongo
    restart: "on-failure:5"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: notification_user
      MONGO_INITDB_ROOT_PASSWORD: notification_pass
      MONGO_INITDB_DATABASE: notification_logs
    volumes:
      - mongo_data:/data/db
    networks:
      - notification_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  redis_data:
  rabbitmq_data:
  mongo_data:

networks:
  notification_network:
    driver: bridge
